[project]
name = "atp"
version = "0.1.0"
description = "Agent Trading Platform v0: one agent, the real backend loop, paper + Alpaca, deterministic replay"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "alpaca-py>=0.40",
    "boto3>=1.35",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "nats-py>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "sentry-sdk>=2.14",
    "sqlalchemy[asyncio]>=2.0.35",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
atp = "atp.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008", "RUF012", "UP047", "ASYNC110", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["alpaca.*", "nats.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres and NATS (docker compose up -d)"]
