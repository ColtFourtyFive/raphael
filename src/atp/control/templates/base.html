<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>atp · {% block title %}control{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--line:#e7e5e4;--red:#b91c1c;--green:#15803d;--amber:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;--line:#44403c;--red:#f87171;--green:#4ade80;--amber:#fbbf24}}
body{font:14px/1.45 ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;max-width:1200px;margin:auto}
nav{display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px;flex-wrap:wrap}
nav b{margin-right:8px} a{color:inherit}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500} .muted{color:var(--muted)} .red{color:var(--red)} .green{color:var(--green)} .amber{color:var(--amber)}
button{font:inherit;padding:4px 10px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:6px;cursor:pointer}
button.danger{border-color:var(--red);color:var(--red)} form{display:inline}
.banner{padding:10px 12px;border:2px solid var(--red);color:var(--red);border-radius:8px;margin-bottom:16px;font-weight:600}
code,pre{font-family:ui-monospace,monospace;font-size:12px} pre{white-space:pre-wrap;margin:0}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<nav><b>atp v0</b><a href="/">Instances</a><a href="/decisions">Decisions</a><a href="/approvals">Approvals</a><a href="/replays">Replays</a></nav>
{% block body %}{% endblock %}
</body>
</html>
