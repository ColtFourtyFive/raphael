{% extends "base.html" %}{% block title %}login{% endblock %}
{% block body %}
<form method="post" action="/login" style="display:block;max-width:320px">
<p>Admin token</p><input type="password" name="token" autofocus style="width:100%;padding:6px">
{% if error %}<p class="red">{{ error }}</p>{% endif %}
<p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
